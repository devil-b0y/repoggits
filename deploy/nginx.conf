# Reverse proxy for a Repoggits installation running with `next start` on 127.0.0.1:3000.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/repoggits
#   sudo ln -s /etc/nginx/sites-available/repoggits /etc/nginx/sites-enabled/repoggits
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace projects.your-domain.edu throughout, then run
# `sudo certbot --nginx -d projects.your-domain.edu` to fill in the certificate
# paths below. APP_ORIGIN must match the address in the server_name line exactly,
# including the https scheme.

upstream repoggits_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name projects.your-domain.edu;

    # Leave this in place so certificate renewals keep working over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name projects.your-domain.edu;

    ssl_certificate     /etc/letsencrypt/live/projects.your-domain.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projects.your-domain.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The application refuses uploads above 20 MB. This leaves room for multipart
    # overhead while rejecting anything larger before it reaches Node.
    client_max_body_size 24m;
    client_body_timeout 120s;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml;
    gzip_min_length 1024;

    # Build assets carry a content hash in their name and never change in place.
    location /_next/static/ {
        proxy_pass http://repoggits_app;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://repoggits_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Empty, so connections to the upstream stay in the keepalive pool above.
        proxy_set_header Connection        "";

        # Streamed App Router responses must not be held back by the proxy.
        proxy_buffering off;
        proxy_request_buffering off;

        # Admin > Backups builds a source ZIP in one request, and large uploads are
        # validated before a response is written.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
