# Repoggits on a single VPS: application and an optional HTTPS proxy. This deployment uses an
# external managed database (Neon) rather than the bundled Postgres container — DATABASE_URL,
# APP_ORIGIN, MAIL_*, DOWNLOAD_SECRET, and EMAIL_VERIFICATION_REQUIRED all come from .env.
#
#   cp .env.local .env                     # already has DATABASE_URL, APP_ORIGIN, etc.
#   docker compose up -d --build           # app on port 3000
#   docker compose --profile tls up -d     # add Caddy and let it obtain certificates
#
# Full instructions, including the first administrator account: docs/DEPLOYMENT.md

name: repoggits

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: '3000'
    ports:
      # Exposed directly: no reverse proxy in front (bare-IP deployment, no domain/TLS yet).
      # Switch back to '127.0.0.1:3000:3000' if a proxy (nginx/Caddy) is put in front later,
      # or remove this mapping entirely when using the bundled Caddy profile.
      - '3000:3000'
    volumes:
      # Administrator invitation files and development outbox dumps.
      - app-local:/app/.local

  caddy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Required by this profile only, so it is not enforced for the plain stack.
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-local:
  caddy-data:
  caddy-config:
